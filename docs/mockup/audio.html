<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChessMaster — Revue audio</title>
    <link rel="stylesheet" href="./mockup.css" />
    <link rel="stylesheet" href="./audio-player.css" />
  </head>
  <body class="audio-review">
    <div class="studio" aria-hidden="true">
      <div class="studio-board"></div>
    </div>

    <main class="audio-shell">
      <header class="audio-brand">
        <img class="audio-crest" src="./crest.webp" alt="" />
        <div>
          <p class="audio-kicker">W3DTS ChessMaster</p>
          <h1>Revue audio</h1>
        </div>
        <a class="ghost audio-back" href="./index.html">Maquette UI</a>
      </header>

      <p class="audio-lead">Comme la revue 3D : une pièce, une tension, les coups. Les WAV viennent de <code>raw_assets/audio-review</code>.</p>

      <section class="audio-panel" aria-labelledby="rooms-title">
        <h2 id="rooms-title">Pièce</h2>
        <div class="audio-rooms" id="rooms"></div>
      </section>

      <section class="audio-panel audio-transport" aria-label="Lecture">
        <canvas class="audio-meter" id="meter" width="640" height="48" aria-hidden="true"></canvas>
        <div class="audio-transport-row">
          <button type="button" class="primary" id="btn-play" data-primary>Lancer les lits</button>
          <button type="button" class="ghost" id="btn-stop">Stop</button>
          <p class="audio-now" id="now">Arrêté</p>
        </div>
        <div class="audio-tension" id="tension" role="group" aria-label="Tension"></div>
      </section>

      <section class="audio-panel" aria-labelledby="shots-title">
        <h2 id="shots-title">Coups</h2>
        <div class="audio-shots" id="shots">
          <button type="button" data-shot="drop">Drop</button>
          <button type="button" data-shot="capture">Capture</button>
          <button type="button" data-shot="check">Échec</button>
          <button type="button" data-shot="win">Gain</button>
          <button type="button" data-shot="lose">Perte</button>
        </div>
      </section>

      <section class="audio-panel audio-mix" aria-labelledby="mix-title">
        <h2 id="mix-title">Mix</h2>
        <label class="field" for="vol-sfx">Coups <span id="vol-sfx-val">80</span></label>
        <div class="scale is-float">
          <input id="vol-sfx" type="range" min="0" max="100" value="80" />
          <span class="scale-thumb" style="--at:0.8" aria-hidden="true"></span>
        </div>
        <label class="field" for="vol-amb">Ambiance <span id="vol-amb-val">40</span></label>
        <div class="scale is-float">
          <input id="vol-amb" type="range" min="0" max="100" value="40" />
          <span class="scale-thumb" style="--at:0.4" aria-hidden="true"></span>
        </div>
        <p class="hint" id="status">Clique Lancer pour débloquer l’audio.</p>
      </section>
    </main>

    <script type="module" src="./audio-player.js"></script>
  </body>
</html>
